[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openpulse-ai"
version = "0.1.0"
description = "Bilingual open-source Telegram news assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "OpenPulse AI Contributors" }]
dependencies = [
  "aiogram>=3.13,<4.0",
  "pydantic-settings>=2.5,<3.0",
]

[project.optional-dependencies]
ai = ["openai>=1.50,<3.0"]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<2.0",
  "ruff>=0.7,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
